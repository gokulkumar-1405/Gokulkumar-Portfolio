<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contact GokulKumar P for portfolio, web development, internship, and collaboration opportunities.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;600;700;800;900&family=Playfair+Display:ital,wght@1,400;1,500;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .navbar .nav-container {
            justify-content: center;
        }
        
        .contact-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 2rem 5rem;
            position: relative;
        }
        
        .contact-page-container {
            max-width: 1200px;
            width: 100%;
        }
        
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary-color);
            text-decoration: none;
            font-size: 1rem;
            margin-bottom: 2rem;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }
        
        .back-button:hover {
            gap: 1.2rem;
            color: var(--secondary-color);
        }
        
        .contact-form-section {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 4rem;
            margin-top: 2rem;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.3);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            color: var(--text-primary);
            margin-bottom: 0.8rem;
            font-weight: 600;
            font-family: var(--font-heading);
            letter-spacing: 0.5px;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }
        
        .submit-btn {
            padding: 1.2rem 3rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: #fff;
            border: none;
            border-radius: 100px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(0, 242, 255, 0.2);
        }
        
        .submit-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0, 242, 255, 0.4);
        }
        
        .contact-methods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 4rem;
        }
        
        .contact-method {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 2.5rem;
            text-align: center;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }
        
        .contact-method:hover {
            background: var(--card-hover);
            border-color: var(--primary-color);
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        
        .contact-method i {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
        }
        
        .contact-method h3 {
            color: var(--text-primary);
            margin-bottom: 1rem;
            font-family: var(--font-heading);
            font-size: 1.5rem;
        }
        
        .contact-method a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: 500;
        }
        
        .contact-method a:hover {
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <!-- Page Loader -->
    <div class="page-loader" id="loader">
        <div class="loader-content">
            <h1 class="loader-text">CONTACT</h1>
        </div>
    </div>

    <!-- Custom Cursor -->
    <div class="cursor-outer"></div>
    <div class="cursor-inner"></div>

    <!-- Scroll Progress Bar -->
    <div class="scroll-progress"></div>

    <!-- Back to Top Button -->
    <button id="backToTop" class="back-to-top" aria-label="Back to top"><i class="fas fa-arrow-up"></i></button>
    
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html#home" class="mobile-nav-title" aria-label="Go to home"></a>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
                
            </div> <br> <br>
           
           
        </div>
    
    </nav>

    <!-- Contact Page -->
    <section class="contact-page">
        <div class="contact-page-container">
            <a href="index.html" class="back-button">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
            
            <h1 class="section-title" data-text="Get In Touch">Get In Touch</h1>
            <p class="contact-intro">Have a project in mind, an internship opportunity, or just want to say hello? I would love to hear from you.</p>
            
            <!-- Contact Form -->
            <div class="contact-form-section">
                <form action="https://api.web3forms.com/submit" method="POST" id="contactForm">
                    <!-- Web3Forms Access Key -->
                    <input type="hidden" name="access_key" value="5eb77542-4ec6-4f59-8e70-5d768ee6433b">
                    <input type="hidden" name="subject" value="New Contact from Portfolio">
                    <input type="hidden" name="from_name" value="Portfolio Contact Form">
                    
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" required placeholder="Enter your name">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="email" required placeholder="Enter your email">
                    </div>
                    
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" required placeholder="What's this about?">
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" required placeholder="Write your message here..."></textarea>
                    </div>
                    
                    <div id="result" style="margin-top: 1rem; padding: 1rem; border-radius: 8px; display: none;"></div>
                    
                    <button type="submit" class="submit-btn">
                        <i class="fas fa-paper-plane"></i> Send Message
                    </button>
                </form>
            </div>
            
            <!-- Contact Methods -->
            <div class="contact-methods">
                <div class="contact-method">
                    <i class="fas fa-envelope"></i>
                    <h3>Email</h3>
                    <a href="mailto:gokulkumar1404@gmail.com">gokulkumar1404@gmail.com</a>
                </div>
                
                <div class="contact-method">
                    <i class="fab fa-linkedin"></i>
                    <h3>LinkedIn</h3>
                    <a href="https://www.linkedin.com/in/gokulkumar-p-893a36378?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=android_app" target="_blank">GokulKumar P</a>
                </div>
                
                <div class="contact-method">
                    <i class="fab fa-whatsapp"></i>
                    <h3>WhatsApp</h3>
                    <a href="https://wa.me/919363135589" target="_blank">+91 9363135589</a>
                </div>
                
                
            </div>
        </div>
    </section>

    <!-- Footer -->
   

    <script src="assets/js/script.js"></script>
    <script>
        const form = document.getElementById('contactForm');
        const result = document.getElementById('result');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(form);
            const object = Object.fromEntries(formData);
            const json = JSON.stringify(object);
            result.innerHTML = "Please wait...";
            result.style.display = "block";
            result.style.background = "rgba(0, 217, 255, 0.1)";
            result.style.color = "#00d9ff";

            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: json
            })
            .then(async (response) => {
                let json = await response.json();
                if (response.status == 200) {
                    result.innerHTML = "✅ Message sent successfully! I'll get back to you soon.";
                    result.style.background = "rgba(0, 217, 255, 0.1)";
                    result.style.color = "#00d9ff";
                    form.reset();
                } else {
                    console.log(response);
                    result.innerHTML = json.message;
                    result.style.background = "rgba(255, 0, 0, 0.1)";
                    result.style.color = "#ff4444";
                }
            })
            .catch(error => {
                console.log(error);
                result.innerHTML = "❌ Something went wrong! Please try again or email me directly.";
                result.style.background = "rgba(255, 0, 0, 0.1)";
                result.style.color = "#ff4444";
            })
            .then(function() {
                setTimeout(() => {
                    result.style.display = "none";
                }, 5000);
            });
        });
    </script>
</body>
</html>
